name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Zip
        run: unzip -o *.zip || true

      - name: Install and Build
        run: npm install && npm run build

      - name: Setup Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android && npx cap init "Taj AI" "com.taj.app" --web-dir dist && npx cap add android && npx cap sync

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taj-AI-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
