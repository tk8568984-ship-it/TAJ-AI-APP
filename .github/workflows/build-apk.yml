name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP File & Move Files
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi
          if [ ! -f "package.json" ]; then
            SUBDIR=$(find . -mindepth 2 -maxdepth 2 -name "package.json" | xargs dirname)
            if [ -n "$SUBDIR" ]; then
              echo "Moving files from $SUBDIR to root..."
              mv $SUBDIR/* . 2>/dev/null || true
              mv $SUBDIR/.* . 2>/dev/null || true
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install & Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Taj AI" "com.taj.app" --web-dir dist
          npx cap add android
          npx cap sync

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taj-AI-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
